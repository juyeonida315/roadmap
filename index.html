<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인생 로드맵</title>
<meta name="theme-color" content="#F3F6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 제목 + 탭(상단 고정) → 탭마다 카드 섹션을 세로로 쌓고, 넓은 화면에서는 2열 */
:root {
  --bg: #F3F6FA;
  --surface: #FFFFFF;
  --sunk: #EBF0F6;
  --ink: #1C2733;
  --muted: #5C6A79;
  --line: #D7E0EA;
  --accent: #2F64C9;
  --accent-soft: rgba(47, 100, 201, .10);
  --accent-ink: #FFFFFF;
  --domino: #C9601F;
  --domino-soft: rgba(217, 105, 43, .12);
  --ok: #2E8455;
  --x: #D23B3B;
  --shadow: 0 1px 2px rgba(20, 40, 70, .05), 0 6px 20px rgba(20, 40, 70, .05);
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161D; --surface: #18212B; --sunk: #202B37; --ink: #E4ECF4; --muted: #9AA9B8; --line: #2B3846;
    --accent: #8DB0F2; --accent-soft: rgba(141, 176, 242, .14); --accent-ink: #0E1A2E;
    --domino: #F29A62; --domino-soft: rgba(242, 154, 98, .15); --ok: #6CC490; --x: #F27A7A;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
#view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
h1 { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: .88rem; max-width: 60ch; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
nav.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: transparent; border-radius: 9px; padding: 7px 13px; font-size: .92rem; color: var(--muted); }
.tab:hover { background: var(--sunk); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

h2 { font-family: var(--font-display); font-size: 1.2rem; margin: 0; }
h3 { font-size: .95rem; margin: 0; font-weight: 600; }
.eyebrow { font-size: .72rem; letter-spacing: .1em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.note { font-size: .84rem; background: var(--sunk); border-radius: 10px; padding: 10px 12px; margin: 0; }

.in { width: 100%; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--surface); min-width: 0; }
.in:focus { border-color: var(--accent); outline: none; }
.in:disabled { background: var(--sunk); color: var(--muted); }
textarea.in { resize: vertical; min-height: 44px; line-height: 1.5; }
select.in { padding: 7px 8px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1 1 160px; min-width: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 13px; font-size: .88rem; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 3px 9px; font-size: .78rem; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--x); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .82rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.chip.fuel { background: var(--domino-soft); color: var(--domino); }
.chip.plain { background: var(--sunk); color: var(--muted); }
.pill { font-size: .72rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.mute { color: var(--muted); } .pill.dom { color: var(--domino); }

/* 나침반 */
.compass { background: linear-gradient(0deg, var(--surface), var(--surface)); border-color: var(--accent); }
.compass .life { font-family: var(--font-display); font-size: 1.15rem; margin: 0; line-height: 1.5; text-wrap: balance; }
.compass .mission { margin: 0; font-size: .88rem; color: var(--muted); }

/* 원씽 사다리 */
.ladder { display: flex; flex-direction: column; gap: 0; }
.rung { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; align-items: center; padding: 7px 0; border-left: 2px solid var(--line); padding-left: 12px; position: relative; }
.rung::before { content: ""; position: absolute; left: -6px; top: 50%; width: 10px; height: 10px; border-radius: 3px; background: var(--surface); border: 2px solid var(--line); transform: translateY(-50%) rotate(45deg); }
.rung .lab { font-size: .8rem; color: var(--muted); }
.rung .txt { font-size: .92rem; }
.rung.today { border-left-color: var(--domino); }
.rung.today::before { border-color: var(--domino); background: var(--domino); }
.question { font-family: var(--font-display); font-size: 1.05rem; margin: 0; text-wrap: balance; }
.onething { font-size: 1.05rem; padding: 11px 12px; border: 2px solid var(--domino); }
.donebox { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--domino); }
.donebox input { width: 20px; height: 20px; accent-color: var(--x); }
.role { font-size: .75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.role.one { background: var(--domino-soft); color: var(--domino); }
.role.rest { background: var(--accent-soft); color: var(--accent); }

.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
.checks input { width: 17px; height: 17px; accent-color: var(--accent); }

/* 주간 */
.days { display: flex; flex-direction: column; gap: 10px; }
.daycard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; }
.daycard.today { border-color: var(--domino); }
.daycard .dh { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.daycard .dname { font-weight: 600; }
.daycard .body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.xbtn { width: 34px; height: 34px; border-radius: 8px; border: 1.5px dashed var(--line); background: transparent; font-size: 1.2rem; font-weight: 700; color: var(--x); display: grid; place-items: center; }
.xbtn.on { border-style: solid; border-color: var(--x); background: rgba(210, 59, 59, .08); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .h { font-size: .72rem; color: var(--muted); text-align: center; }
.cal .c { aspect-ratio: 1 / 1; border-radius: 8px; background: var(--sunk); font-size: .78rem; display: grid; place-items: center; position: relative; color: var(--muted); max-width: 100%; }
.cal .c.today { outline: 2px solid var(--domino); }
.cal .c b { position: absolute; inset: 0; display: grid; place-items: center; color: var(--x); font-size: 1.6rem; font-weight: 700; opacity: .85; }
.stat { display: flex; flex-wrap: wrap; gap: 8px; }
.stat > div { flex: 1 1 100px; background: var(--sunk); border-radius: 10px; padding: 8px 12px; }
.stat .k { font-size: .75rem; color: var(--muted); }
.stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* 목록 */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.li .grow { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; }
.li.done .grow { color: var(--muted); }
.empty { color: var(--muted); font-size: .88rem; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }

/* 표 */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: .75rem; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.up { color: var(--ok); font-weight: 700; }
td .in { padding: 5px 7px; }

/* 진행 막대 */
.prog { display: grid; grid-template-columns: 6em minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.bar { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; position: relative; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--accent); }
.bar i.ch { background: var(--domino); opacity: .75; }
.prog .v { font-size: .8rem; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }

/* 만다라트 */
.mandal-wrap { overflow-x: auto; padding-bottom: 4px; }
.mandal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; min-width: 660px; }
.mblock { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; background: var(--line); border-radius: 10px; padding: 3px; }
.mblock.center { background: var(--accent); }
.mcell { aspect-ratio: 1 / 1; background: var(--surface); border-radius: 6px; display: grid; place-items: center; padding: 3px; }
.mcell textarea { width: 100%; height: 100%; border: 0; background: transparent; resize: none; text-align: center; font-size: .72rem; line-height: 1.3; padding: 2px; overflow: hidden; }
.mcell textarea:focus { outline: 2px solid var(--accent); border-radius: 4px; }
.mcell.goal { background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); font-weight: 600; }
.mcell.core { background: linear-gradient(var(--domino-soft), var(--domino-soft)), var(--surface); }
.mcell.core textarea { font-weight: 700; font-size: .78rem; }
.mcell .ro { font-size: .72rem; text-align: center; line-height: 1.3; overflow-wrap: anywhere; color: var(--accent); }
.gtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.gtab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: .82rem; }
.gtab[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.quarters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.quarter { background: var(--sunk); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }

/* 차트 */
.chart { width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.spark { width: 100%; height: 90px; display: block; }
.spark text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }

/* 연결 패널 */
.panel { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 22px; }
.qr { background: #FFFFFF; padding: 8px; border-radius: 8px; width: 176px; height: 176px; }
.qr img, .qr canvas { display: block; width: 160px; height: 160px; }
.warn { color: var(--domino); font-size: .84rem; margin: 0; }

footer { color: var(--muted); font-size: .8rem; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .88rem; max-width: calc(100% - 32px); z-index: 10; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .quarters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  h1 { font-size: 1.55rem; }
  .card { padding: 14px; }
  .daycard { grid-template-columns: minmax(0, 1fr); }
  .daycard .dh { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .daycard .body { grid-template-columns: minmax(0, 1fr); }
  .rung { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .panel { grid-template-columns: minmax(0, 1fr); }
  .prog { grid-template-columns: 5em minmax(0, 1fr); }
  .prog .v { grid-column: 2; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>인생 로드맵</h1>
      <p class="sub" id="subtitle">가장 먼저 넘어뜨릴 도미노 하나에 집중하기</p>
    </div>
    <button class="btn" id="panelBtn">연결 · 백업</button>
  </header>

  <section class="panel" id="panel" hidden>
    <div class="qr" id="qr" aria-label="연결 링크 QR 코드"></div>
    <div class="stack" style="gap:10px">
      <div>
        <h2>다른 기기 연결</h2>
        <p class="hint">폰 카메라로 QR을 찍거나 링크를 폰으로 보내 열면 같은 기록이 보여요. 한 번 열면 그 기기가 기억해요.</p>
      </div>
      <div class="row"><input class="in grow" id="syncLink" readonly aria-label="연결 링크"><button class="btn" id="copyLink">링크 복사</button></div>
      <p class="warn">이 링크가 곧 비밀번호예요. 돈과 목표 기록이 담겨 있으니 남에게 보내지 마세요.</p>
      <div>
        <h2>백업 · 시작 파일</h2>
        <p class="hint">백업 파일은 모든 기록을 내 컴퓨터에 저장해요. 시작 파일이나 백업 파일을 불러오면 같은 항목은 덮어써요.</p>
      </div>
      <div class="row">
        <button class="btn" id="exportBtn">백업 파일로 저장</button>
        <label class="btn" for="importFile" style="cursor:pointer">파일 불러오기</label>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
      <div id="importConfirm" class="row" hidden></div>
    </div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="메뉴"></nav>
  <main id="view"><div class="loading">기록을 불러오는 중…</div></main>

  <footer>
    <span>미완료는 실패가 아니라 다음 주로 넘어간 것뿐이에요.</span>
    <span id="storeNote">연결 중…</span>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyBS2n-0XJYFhPj8sL03BYsKmQSj7IUGdaU",
  authDomain: "nutrition-checklist.firebaseapp.com",
  projectId: "nutrition-checklist",

};
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ---------- 기본 도우미 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const mondayOf = (s) => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const weekId = (s) => "w" + mondayOf(s);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const md = (s) => { const d = parseYmd(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const splitList = (s) => String(s || "").split(/[,，\n]/).map((x) => x.trim()).filter(Boolean);
const quarterKey = (d = new Date()) => `${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
// 만원 단위 → 보기 좋게
function man(n) {
  if (n == null || n === "" || isNaN(n)) return "–";
  n = Number(n);
  if (Math.abs(n) >= 10000) { const e = n / 10000; return (Number.isInteger(e) ? e : e.toFixed(1)) + "억"; }
  return n.toLocaleString("ko-KR") + "만";
}
const won = (n) => (Number(n) || 0).toLocaleString("ko-KR") + "원";
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* ---------- 동기화 코드 ---------- */
const CODE_RE = /^[A-Za-z0-9]{20,64}$/;
function resolveCode() {
  const h = location.hash.slice(1);
  if (CODE_RE.test(h)) { lsSet("rm:code", h); return h; }
  let c = lsGet("rm:code");
  if (!c || !CODE_RE.test(c)) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
    const a = new Uint32Array(24); crypto.getRandomValues(a);
    c = Array.from(a, (x) => chars[x % chars.length]).join("");
    lsSet("rm:code", c);
  }
  history.replaceState(null, "", location.pathname + location.search + "#" + c);
  return c;
}
const CODE = resolveCode();
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (CODE_RE.test(h) && h !== CODE) { lsSet("rm:code", h); location.reload(); }
});

/* ---------- 데이터 기본값 ---------- */
const HORIZONS = [
  { key: "y10", label: "10년 뒤" }, { key: "y5", label: "5년 뒤" }, { key: "y3", label: "3년 뒤" },
  { key: "y1", label: "1년 뒤" }, { key: "m6", label: "6개월 뒤" }, { key: "m3", label: "3개월 뒤" }, { key: "m1", label: "1개월 뒤" },

function defaultFor(name) {
  if (name.startsWith("mandalart-")) return mandalDef();
  if (/^w\d{4}/.test(name)) return weekDef();
  return DEFAULTS[name]();
}
function fill(def, data) {
  if (data === undefined || data === null) return def;
  if (Array.isArray(def)) return Array.isArray(data) ? data : def;
  if (def && typeof def === "object") {
    if (typeof data !== "object" || Array.isArray(data)) return def;
    const out = { ...data };
    for (const k of Object.keys(def)) out[k] = fill(def[k], data[k]);
    return out;
  }
  return data;
}
function normalize(name, data) {
  const d = fill(defaultFor(name), data);
  if (name.startsWith("mandalart-")) d.goals = Array.from({ length: 8 }, (_, i) => fill(goalDef(), (d.goals || [])[i]));
  return d;
}

/* ---------- 저장소 ---------- */
const cache = {}, loaded = {}, subs = {}, saveTimers = {}, saving = {};
let store = null, storeReady = false;
const D = (name) => (cache[name] ||= defaultFor(name));

const localStore = {
  name: "이 기기에만 저장 중 (인터넷 연결을 확인하세요)",
  sub(name, cb) { setTimeout(() => { let v = null; try { v = JSON.parse(lsGet("rm:doc:" + name) || "null"); } catch (e) {} cb(v, false); }, 0); },
  async get(name) { try { return JSON.parse(lsGet("rm:doc:" + name) || "null"); } catch (e) { return null; } },
  async save(name, data) { lsSet("rm:doc:" + name, JSON.stringify(data)); },
};
async function makeFirebaseStore() {
  const { initializeApp } = await import(FB + "firebase-app.js");
  const fs = await import(FB + "firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() }); } catch (e) { db = fs.getFirestore(app); }
  const ref = (name) => fs.doc(db, "roadmap", CODE, /^w\d{4}/.test(name) ? "weeks" : "docs", name);
  return {
    name: "자동 저장 · 모든 기기에 동기화",
    sub(name, cb, err) { fs.onSnapshot(ref(name), (s) => cb(s.exists() ? s.data() : null, s.metadata.hasPendingWrites), err); },
    async get(name) { const s = await fs.getDoc(ref(name)); return s.exists() ? s.data() : null; },
    async save(name, data) { await fs.setDoc(ref(name), data); },
  };
}
function ensure(name) {
  if (subs[name]) return;
  subs[name] = true;
  if (storeReady) startSub(name);
}
function startSub(name) {
  store.sub(name, (data, pend) => {
    if (pend || saveTimers[name] || saving[name]) return;
    cache[name] = normalize(name, data);
    loaded[name] = true;
    requestRender();
  }, onStoreError);
}
function onStoreError(err) {
  console.error(err);
  $("storeNote").textContent = err && err.code === "permission-denied"
    ? "권한 오류: Firestore 보안 규칙에 roadmap 부분을 추가했는지 확인하세요"
    : "동기화 오류: 인터넷 연결을 확인하세요";
}
function touch(name) {
  if (/^w\d{4}/.test(name) || name.startsWith("mandalart-")) {
    const idx = D("profile").index, list = name.startsWith("w") ? idx.weeks : idx.mandal;
    if (loaded.profile && !list.includes(name)) { list.push(name); touch("profile"); }
  }
  clearTimeout(saveTimers[name]);
  saveTimers[name] = setTimeout(() => flush(name), 600);
}
async function flush(name) {
  clearTimeout(saveTimers[name]); delete saveTimers[name];
  if (saving[name]) { saving[name] = "again"; return; }
  saving[name] = true;
  try { await store.save(name, JSON.parse(JSON.stringify(D(name)))); }
  catch (e) { console.error(e); toast(e && e.code === "permission-denied" ? "저장 권한이 없어요. 보안 규칙을 확인하세요" : "저장하지 못했어요. 인터넷 연결을 확인해 주세요"); }
  const again = saving[name] === "again";
  delete saving[name];
  if (again) flush(name);
}
async function flushAll() { await Promise.all(Object.keys(saveTimers).map(flush)); }
window.addEventListener("pagehide", flushAll);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushAll(); });

const getPath = (o, p) => p.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
function setPath(o, p, v) {
  const ks = p.split(".");
  for (let i = 0; i < ks.length - 1; i++) {
    if (o[ks[i]] == null || typeof o[ks[i]] !== "object") o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    o = o[ks[i]];
  }
  o[ks[ks.length - 1]] = v;
}
const bind = (doc, path) => `data-doc="${doc}" data-path="${esc(path)}" ${loaded[doc] ? "" : "disabled"}`;
function inp(doc, path, { type = "text", ph = "", cls = "", rows = 2, num = false, attrs = "" } = {}) {

  if (type === "textarea") return `<textarea class="in ${cls}" rows="${rows}" ${bind(doc, path)} placeholder="${esc(ph)}" ${attrs}>${esc(v ?? "")}</textarea>`;
  if (type === "checkbox") return `<input type="checkbox" class="${cls}" ${bind(doc, path)} ${v ? "checked" : ""} ${attrs}>`;
  return `<input class="in ${cls}" type="${type}" ${bind(doc, path)} ${num ? "data-num" : ""} value="${esc(v ?? "")}" placeholder="${esc(ph)}" ${attrs}>`;
}
function sel(doc, path, options, { num = false, cls = "", attrs = "" } = {}) {

function roleOf(date) {
  // 월~금 원씽 · 토 휴식 · 일 휴식 + 회고·계획
  const wd = (parseYmd(date).getDay() + 6) % 7;

  return ["휴식·회고", "rest"];
}
const dp = (date, f) => `days.${date}.${f}`;
function sleepHours(day) {
  if (!day || !day.sleep || !day.wake) return null;
  const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
  let diff = toMin(day.wake) - toMin(day.sleep);
  if (diff <= 0) diff += 24 * 60;
  return Math.round(diff / 6) / 10;
}

    <div class="grid">

      ${fld("다음 주에 할 것", inp(wk, "review.next", { type: "textarea" }))}
    </div>

function chainCalendar(y, m) {
  const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  const cells = ["월", "화", "수", "목", "금", "토", "일"].map((h) => `<div class="h">${h}</div>`);
  for (let i = 0; i < lead; i++) cells.push("<div></div>");
  for (let d = 1; d <= n; d++) {
    const ds = ymd(new Date(y, m, d)), w = weekId(ds);
    ensure(w);
    const done = ((D(w).days || {})[ds] || {}).oneDone;
    cells.push(`<div class="c ${ds === today() ? "today" : ""}">${d}${done ? "<b>✕</b>" : ""}</div>`);
  }
  return `<div class="cal">${cells.join("")}</div>`;
}

        else { const g = POS.indexOf(c); cells.push(`<div class="mcell goal">${mta(name, `goals.${g}.title`, `세부 목표 ${g + 1}`)}</div>`); }
      }
      blocks.push(`<div class="mblock center">${cells.join("")}</div>`);
    } else {

      for (let c = 0; c < 9; c++) {

        else { const a = POS.indexOf(c); cells.push(`<div class="mcell">${mta(name, `goals.${g}.actions.${a}`, "")}</div>`); }
      }
      blocks.push(`<div class="mblock">${cells.join("")}</div>`);

  const quarters = [0, 1, 2, 3].map((qi) => `<div class="quarter">

    </div>`).join("");
  const y = now.getFullYear();
  return `
  <div class="row" style="justify-content:space-between">
    <div class="row">${[y - 1, y, y + 1, y + 2].map((yr) => `<button class="btn sm ${yr === state.year ? "primary" : ""}" data-act="year" data-y="${yr}">${yr}</button>`).join("")}</div>

    <div class="mandal-wrap"><div class="mandal">${blocks.join("")}</div></div>
  </section>
  <section class="card">
    <header><h2>세부 목표 나누기</h2><span class="hint">분기 → 월 → 주. 주별 실천은 ‘이번 주’ 탭에서 연결해요</span></header>
    <div class="gtabs">${M.goals.map((g, i) => `<button class="gtab" data-act="goal" data-i="${i}" aria-pressed="${i === gi}">${esc(g.title) || `세부 목표 ${i + 1}`}</button>`).join("")}</div>

    <div class="quarters">${quarters}</div>
  </section>`;
}
const mta = (doc, path, ph) => {

};

/* ---------- 차트 ---------- */
function radar(axes, vals, prev) {
  const N = axes.length, R = 82, cx = 150, cy = 120;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N, r = R * (Math.max(0, Math.min(10, v || 0)) / 10); return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const poly = (vs) => vs.map((v, i) => pt(i, v).map((n) => n.toFixed(1)).join(",")).join(" ");
  const rings = [2, 4, 6, 8, 10].map((v) => `<polygon points="${poly(Array(N).fill(v))}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join("");
  const spokes = axes.map((_, i) => { const [x, y] = pt(i, 10); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/>`; }).join("");
  const labels = axes.map((a, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / N, x = cx + (R + 16) * Math.cos(ang), y = cy + (R + 16) * Math.sin(ang);
    const anchor = Math.abs(Math.cos(ang)) < 0.2 ? "middle" : Math.cos(ang) > 0 ? "start" : "end";
    return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="${anchor}">${esc(a)}${vals[i] != null ? " " + vals[i] : ""}</text>`;
  }).join("");
  const has = vals.some((v) => v != null);
  return `<svg class="chart" viewBox="0 0 300 245" role="img" aria-label="${esc(axes.join(", "))} 점수 그래프">
    ${rings}${spokes}
    ${prev ? `<polygon points="${poly(prev)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1.5"/>` : ""}
    ${has ? `<polygon points="${poly(vals)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/>` : ""}
    ${has ? vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--accent)"/>`; }).join("") : ""}
    ${labels}</svg>`;
}
function spark(assets) {
  const W = 300, H = 90, pl = 8, pr = 8, pt = 14, pb = 18;
  const vals = assets.map((a) => Number(a.amount) || 0), max = Math.max(...vals), min = Math.min(...vals, 0);
  const x = (i) => pl + (W - pl - pr) * (assets.length === 1 ? 0.5 : i / (assets.length - 1));
  const y = (v) => pt + (H - pt - pb) * (1 - (v - min) / ((max - min) || 1));
  const line = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area = `${x(0).toFixed(1)},${(H - pb).toFixed(1)} ${line} ${x(vals.length - 1).toFixed(1)},${(H - pb).toFixed(1)}`;
  const li = vals.length - 1;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="자산 추이">
    <line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>
    <polygon points="${area}" fill="var(--accent-soft)"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(li).toFixed(1)}" cy="${y(vals[li]).toFixed(1)}" r="3.5" fill="var(--accent)"/>
    <text x="${pl}" y="${H - 4}">${esc(assets[0].month)}</text>
    <text x="${W - pr}" y="${H - 4}" text-anchor="end">${esc(assets[li].month)} · ${man(vals[li])}</text>
  </svg>`;
}

let renderQueued = false, started = false;
function isTyping() { const a = document.activeElement; return a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox"; }
function requestRender() { if (!started) return; if (isTyping()) { renderQueued = true; return; } render(); }
function render() {
  renderQueued = false;
  if (!TABS.some(([k]) => k === state.tab)) state.tab = "today";
  $("tabs").innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join("");

  const y = window.scrollY;
  $("view").innerHTML = RENDER[state.tab]();
  window.scrollTo(0, y);
}
document.addEventListener("focusout", () => setTimeout(() => { if (renderQueued && !isTyping()) render(); }, 0));

/* ---------- 입력 처리 ---------- */
const view = $("view");
function writeFrom(t) {
  let v;
  if (t.type === "checkbox") v = t.checked;
  else if (t.dataset.num !== undefined) v = t.value === "" ? null : Number(t.value);
  else v = t.value;
  setPath(D(t.dataset.doc), t.dataset.path, v);
  touch(t.dataset.doc);
}
view.addEventListener("input", (e) => { const t = e.target; if (t.dataset.path && t.type !== "checkbox" && t.tagName !== "SELECT") writeFrom(t); });
view.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.local === "quarter") { state.quarter = t.value; render(); return; }
  if (!t.dataset.path) return;
  writeFrom(t);
  if (t.type === "checkbox" || t.tagName === "SELECT") render(); else renderQueued = true;
});

const listOf = (doc, key) => { const d = D(doc); if (!Array.isArray(d[key])) d[key] = []; return d[key]; };
view.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "day") { state.day = b.dataset.n === "0" ? today() : addDays(state.day, +b.dataset.n); render(); }
  else if (a === "week") { state.week = b.dataset.n === "0" ? mondayOf(today()) : addDays(state.week, +b.dataset.n); render(); }
  else if (a === "year") { state.year = +b.dataset.y; state.goal = 0; render(); }
  else if (a === "goal") { state.goal = +b.dataset.i; render(); }
  else if (a === "xday") {
    const ds = b.dataset.date, wk = weekId(ds), W = D(wk);
    const cur = !!getPath(W, dp(ds, "oneDone"));
    setPath(W, dp(ds, "oneDone"), !cur); touch(wk); render();
  }
  else if (a === "addWeekMandal") { const wk = "w" + state.week; listOf(wk, "mandal").push({ id: uid(), goal: "", text: "", done: false }); touch(wk); render(); }
  else if (a === "rmWeekMandal") { const wk = "w" + state.week; listOf(wk, "mandal").splice(+b.dataset.i, 1); touch(wk); render(); }
  else if (a === "rmList") { confirmThen(b, () => { listOf(b.dataset.doc, b.dataset.key).splice(+b.dataset.i, 1); touch(b.dataset.doc); render(); }); }
  else if (a === "rmById") { confirmThen(b, () => { const l = listOf(b.dataset.doc, b.dataset.key); const i = l.findIndex((x) => x.id === b.dataset.id); if (i >= 0) l.splice(i, 1); touch(b.dataset.doc); render(); }); }
  else if (a === "rmAsset") { confirmThen(b, () => { const l = listOf("money", "assets"); const i = l.findIndex((x) => x.month === b.dataset.month); if (i >= 0) l.splice(i, 1); touch("money"); render(); }); }
  else if (a === "hexSave") {
    const H = D("health");
    H.checks.push({ date: today(), scores: { ...H.draft } });
    if (H.checks.length > 24) H.checks.shift();
    touch("health"); render(); toast("점검을 기록했어요");
  }
});
// 삭제는 한 번 더 눌러야
function confirmThen(b, fn) {
  if (b.dataset.armed) { fn(); return; }
  b.dataset.armed = "1"; const old = b.textContent; b.textContent = "정말 삭제?"; b.style.color = "var(--x)";
  setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = old; b.style.color = ""; } }, 3000);
}

view.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  const n = (x) => (x === "" || x == null ? null : Number(x));
  const kind = f.dataset.form;
  if (kind === "later") { listOf("profile", "later").push({ id: uid(), text: v.text.trim(), when: v.when.trim() }); touch("profile"); }
  else if (kind === "shipped") { listOf("profile", "shipped").push({ id: uid(), date: today(), what: v.what.trim(), learned: v.learned.trim() }); touch("profile"); toast("70점 보관함에 넣었어요. 내놓은 것 자체가 한 걸음이에요"); }
  else if (kind === "reward") { listOf("health", "rewards").push(v.text.trim()); touch("health"); }
  else if (kind === "asset") {
    const l = listOf("money", "assets"), i = l.findIndex((x) => x.month === v.month);
    if (i >= 0) l[i].amount = n(v.amount); else l.push({ month: v.month, amount: n(v.amount) });
    touch("money"); toast(i >= 0 ? "그 달 기록을 고쳤어요" : "자산을 기록했어요");
  }
  else if (kind === "flow") { listOf("money", "flows").push({ month: v.month, income: n(v.income), spend: n(v.spend), save: n(v.save) }); touch("money"); }
  else if (kind === "moziri") {
    const first = !D("money").moziri.length;
    listOf("money", "moziri").push({ id: uid(), date: v.date, type: v.type, title: v.title.trim(), amount: n(v.amount) || 0 });
    touch("money"); toast(first ? "첫 수익 축하해요! 첫 도미노가 넘어갔어요" : "수익을 기록했어요");
  }
  else if (kind === "bucket") { listOf("bucket", "items").push({ id: uid(), title: v.title.trim(), cat: v.cat, when: v.when.trim(), with: v.with.trim(), cost: n(v.cost), done: false, doneDate: "", note: "" }); touch("bucket"); }
  else if (kind === "criterion") { listOf("companies", "criteria").push(v.text.trim()); touch("companies"); }
  else if (kind === "company") { listOf("companies", "items").push({ id: uid(), name: v.name.trim(), role: v.role.trim(), status: "관심", scores: {}, memo: "" }); touch("companies"); }
  render();
});
// 체크박스가 바뀌면 완료 날짜 자동 기록 (버킷리스트)
view.addEventListener("change", (e) => {
  const t = e.target, m = t.dataset.path && t.dataset.doc === "bucket" && t.dataset.path.match(/^items\.(\d+)\.done$/);
  if (m && t.checked) { const it = D("bucket").items[+m[1]]; if (it && !it.doneDate) { it.doneDate = today(); touch("bucket"); render(); toast("해냈어요! 소감 한 줄을 남겨 보세요"); } }
});

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; lsSet("rm:tab", state.tab); render();
  window.scrollTo(0, 0);
});

/* ---------- 연결 · 백업 ---------- */
const syncUrl = location.origin + location.pathname + "#" + CODE;
let qrDrawn = false;
$("panelBtn").onclick = () => {
  const p = $("panel"); p.hidden = !p.hidden; $("syncLink").value = syncUrl;
  if (!p.hidden && !qrDrawn && window.QRCode) { new QRCode($("qr"), { text: syncUrl, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M }); qrDrawn = true; }
};
$("copyLink").onclick = async () => {
  try { await navigator.clipboard.writeText(syncUrl); toast("링크를 복사했어요"); }
  catch (e) { $("syncLink").select(); toast("링크를 선택했어요. 길게 눌러 복사하세요"); }
};
$("exportBtn").onclick = async () => {
  await flushAll();
  const P = D("profile");
  const names = ["profile", "money", "bucket", "companies", "health", ...P.index.mandal, ...P.index.weeks];
  const docs = {};
  for (const name of [...new Set(names)]) {
    try { const d = await store.get(name); if (d) docs[name] = d; else if (cache[name]) docs[name] = cache[name]; }
    catch (e) { if (cache[name]) docs[name] = cache[name]; }
  }
  const blob = new Blob([JSON.stringify({ app: "life-roadmap", version: 1, exportedAt: new Date().toISOString(), docs }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `인생로드맵-백업-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("백업 파일을 저장했어요");
};
$("importFile").onchange = async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (err) { toast("파일을 읽지 못했어요. JSON 파일인지 확인하세요"); return; }
  const docs = data && data.docs && typeof data.docs === "object" ? data.docs : null;
  const names = docs ? Object.keys(docs).filter((k) => DOC_RE.test(k)) : [];
  if (!names.length) { toast("불러올 내용이 없는 파일이에요"); return; }
  state.pendingImport = { docs, names };
  const box = $("importConfirm");
  box.innerHTML = `<span class="hint grow">${names.length}개 항목(${names.slice(0, 5).map(esc).join(", ")}${names.length > 5 ? " 등" : ""})을 불러오면 지금 기록을 덮어써요.</span>
    <button class="btn primary" id="doImport">불러오기</button><button class="btn" id="cancelImport">취소</button>`;
  box.hidden = false;
};
$("importConfirm").addEventListener("click", async (e) => {
  if (e.target.id === "cancelImport") { state.pendingImport = null; $("importConfirm").hidden = true; return; }
  if (e.target.id !== "doImport" || !state.pendingImport) return;
  const { docs, names } = state.pendingImport;
  for (const name of names) { cache[name] = normalize(name, docs[name]); loaded[name] = true; }
  const idx = D("profile").index;
  for (const name of names) {
    if (/^w\d{4}/.test(name) && !idx.weeks.includes(name)) idx.weeks.push(name);
    if (name.startsWith("mandalart-") && !idx.mandal.includes(name)) idx.mandal.push(name);
  }
  await Promise.all([...new Set([...names, "profile"])].map(flush));
  state.pendingImport = null; $("importConfirm").hidden = true;
  render(); toast("불러왔어요");
});

let toastTimer;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2400); }

/* ---------- 시작 ---------- */
async function init() {
  try { store = await makeFirebaseStore(); } catch (e) { console.error(e); store = localStore; }
  $("storeNote").textContent = store.name;
  const early = Object.keys(subs); // 준비 전에 요청된 문서
  storeReady = true;
  early.forEach(startSub);
  ["profile", "money", "bucket", "companies", "health"].forEach(ensure);
  // 기본 문서를 받은 뒤(최대 5초) 화면 시작
  const t0 = Date.now();
  const wait = () => {
    if (loaded.profile || Date.now() - t0 > 5000) { started = true; render(); }
    else setTimeout(wait, 80);
  };
  wait();
}
init();
</script>
